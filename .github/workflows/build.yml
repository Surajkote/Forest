name: Build Desktop Installers
on:
  push:
    branches: [ main, master ]

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    
    # THIS TELLS GITHUB TO STEP INSIDE YOUR FOLDER FIRST
    defaults:
      run:
        working-directory: ./Forest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install Node Packages
        run: npm install

      - name: Build Tauri (macOS)
        if: matrix.platform == 'macos-latest'
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Build Tauri (Windows)
        if: matrix.platform == 'windows-latest'
        run: npx @tauri-apps/cli build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Forest-${{ matrix.platform }}
          # UPDATED PATHS TO LOOK INSIDE THE FOREST FOLDER
          path: |
            Forest/src-tauri/target/**/bundle/dmg/*.dmg
            Forest/src-tauri/target/**/bundle/nsis/*.exe
